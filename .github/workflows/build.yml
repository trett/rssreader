name: 'Build and Publish'

on:
  workflow_dispatch:

env:
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_PROJECT_ID: ${{ secrets.GAR_PROJECT_ID }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  IMAGE_NAME: rssreader

jobs:
  Build-Containers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'sbt'

      # CVE-2026-91403 / CVE-2026-114820: Native Image embeds the build JDK's
      # cacerts into the binary, and GraalVM CE has no fixed release yet.
      # Remove the roots that chain to the compromised eMudhra intermediates,
      # per the GraalVM Native Image advisory (Oct 2026), plus emSign G1/G2
      # to match Oracle JDK .0.3 builds (CVE-2026-114820).
      - name: Distrust eMudhra roots (CVE-2026-91403)
        run: |
          for alias in "emsigneccrootcag3 [jdk]" "emsignrootcag1 [jdk]" "emsignrootcag2 [jdk]" "comodoaaaca [jdk]"; do
            keytool -delete -cacerts -storepass changeit -alias "$alias" || true
            if keytool -list -cacerts -storepass changeit -alias "$alias" >/dev/null 2>&1; then
              echo "::error::$alias is still present in cacerts"
              exit 1
            fi
          done
          echo "Remaining eMudhra/emSign entries:"
          keytool -list -cacerts -storepass changeit | grep -i -E "emsign|emudhra" || echo "none"

      - uses: sbt/setup-sbt@v1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev

      - name: Set short git commit SHA
        id: vars
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Native Image and Stage Docker
        run: sbt "server/Docker/stage"
        env:
          SBT_OPTS: -Xmx12G
          DOCKER_TAG: ${{ env.DOCKER_TAG }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          docker build -t $IMAGE_TAG server/target/docker/stage
          docker push $IMAGE_TAG
